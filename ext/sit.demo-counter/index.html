<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>记一笔</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p class="hint">点一下按钮，记一笔。</p>

      数据存在本机（这条拓展自己的存储里），换拓展不会互相看到；卡片简介会跟着计数走。
    </p>
  </main>
  <script src="app.js"></script>

</html>
